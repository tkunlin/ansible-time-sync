- name: Set primary chrony server
  ansible.builtin.set_fact:
    chrony_primary_server: "{{ chrony_time_servers[0] }}"

# 先嘗試 waitsync，但不要在這一步直接讓 playbook 失敗。
# 因為某些情況下 waitsync 仍可能回 rc=1，但 sources 稍後其實會正常變成 ^*。
- name: Try chrony waitsync before source assertion
  ansible.builtin.command: chronyc waitsync 30 0.05 0 5
  register: chrony_waitsync
  changed_when: false
  failed_when: false

# 使用 sources 本身做 retry gate。
# 這比單純依賴 waitsync 更直觀，也符合我們真正要驗證的目標：
# 10.88.0.23 是否被選為 current best source，也就是 ^*。
- name: Wait until chrony selects expected source
  ansible.builtin.command: chronyc -n sources
  register: chrony_sources
  changed_when: false
  retries: 30
  delay: 5
  until:
    - chrony_sources.stdout is regex('(?m)^\\^\\*\\s+' ~ chrony_primary_server ~ '\\s')

- name: Verify chrony tracking
  ansible.builtin.command: chronyc tracking
  register: chrony_tracking
  changed_when: false

- name: Verify chrony activity
  ansible.builtin.command: chronyc -n activity
  register: chrony_activity
  changed_when: false
  failed_when: false

- name: Verify chrony sourcestats
  ansible.builtin.command: chronyc -n sourcestats
  register: chrony_sourcestats
  changed_when: false
  failed_when: false

- name: Assert chrony is using expected time server
  ansible.builtin.assert:
    that:
      - chrony_primary_server in chrony_sources.stdout
      - chrony_sources.stdout is regex('(?m)^\\^\\*\\s+' ~ chrony_primary_server ~ '\\s')
      - chrony_tracking.stdout is regex('(?m)^Leap status\\s+:\\s+Normal\\s*$')
    fail_msg: |
      Chrony is not fully synced to expected server {{ chrony_primary_server }}.

      Expected:
        - chronyc sources should contain: ^* {{ chrony_primary_server }}
        - chronyc tracking should show: Leap status : Normal

      waitsync rc:
      {{ chrony_waitsync.rc | default('N/A') }}

      waitsync output:
      {{ chrony_waitsync.stdout | default('') }}

      Current sources:
      {{ chrony_sources.stdout | default('') }}

      Current tracking:
      {{ chrony_tracking.stdout | default('') }}

      Current activity:
      {{ chrony_activity.stdout | default('') }}

      Current sourcestats:
      {{ chrony_sourcestats.stdout | default('') }}

    success_msg: |
      Chrony looks OK on {{ inventory_hostname }}.

      Current sources:
      {{ chrony_sources.stdout }}

      Current tracking:
      {{ chrony_tracking.stdout }}

- name: Show chrony verification summary
  ansible.builtin.debug:
    msg: |
      Chrony verification summary for {{ inventory_hostname }}:

      waitsync rc:
      {{ chrony_waitsync.rc | default('N/A') }}

      sources:
      {{ chrony_sources.stdout }}

      tracking:
      {{ chrony_tracking.stdout }}

      activity:
      {{ chrony_activity.stdout | default('') }}

      sourcestats:
      {{ chrony_sourcestats.stdout | default('') }}

